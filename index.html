<!doctype html><html lang=zh-CN><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>旅行计划</title><style>body{margin:0;font:15px system-ui;background:#f6f4ef;color:#292a27}.layout{display:flex;min-height:100vh}.side{width:230px;background:#292a27;color:#fff;padding:22px 14px;box-sizing:border-box}.side h3{margin:0 8px 18px}.plan{display:block;width:100%;padding:11px 10px;border:0;background:none;color:#ccc;text-align:left;border-radius:6px}.plan.on{background:#4b4c47;color:#fff}.newplan{margin-top:12px;width:100%;padding:10px;border:1px dashed #777;background:none;color:#fff;border-radius:6px}.main{max-width:800px;flex:1;padding:30px}.dates{display:flex;gap:8px;overflow:auto;margin:20px 0;border-bottom:1px solid #ddd}.date{padding:12px;border:0;background:none;color:#888;min-width:90px}.date.on{background:#292a27;color:#fff;border-radius:7px}.bar{display:flex;justify-content:space-between;align-items:center}.btn{background:#d96e4e;color:#fff;border:0;border-radius:6px;padding:10px 13px}.item{display:grid;grid-template-columns:55px 12px 1fr 25px;padding:17px 0;border-top:1px solid #ddd;gap:9px}.dot{width:10px;height:10px;background:#d96e4e;border-radius:50%;margin-top:4px}.item h4{margin:0 0 5px}.sub{font-size:12px;color:#888}.pics img{width:64px;height:64px;object-fit:cover;border-radius:5px;margin:5px 5px 0 0}.empty{text-align:center;color:#888;padding:45px}.summary{margin-top:25px;background:#fff;border:1px solid #ddd;padding:15px;border-radius:8px}dialog{border:0;border-radius:10px;padding:20px;width:min(480px,calc(100% - 30px))}label{display:block;color:#777;font-size:12px;margin:10px 0}input,textarea{width:100%;box-sizing:border-box;padding:9px;margin-top:5px;border:1px solid #ddd;border-radius:5px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{display:none;position:fixed;bottom:20px;left:50%;background:#222;color:#fff;padding:10px;border-radius:6px}@media(max-width:700px){.layout{display:block}.side{width:100%;padding:14px}.plan{display:none}.plan.on{display:block}.main{padding:20px 16px}}
</style><div class=layout><aside class=side><h3>旅行计划</h3><div id=plans></div><button class=newplan onclick=newPlan()>＋ 新建旅行计划</button></aside><main class=main><h1 id=title>还没有旅行计划</h1><p>所有日期、地点、行程和图片由你自己创建</p><div id=dates class=dates></div><div class=bar><h2 id=day>先创建一个日期</h2><button class=btn id=addday onclick=newDay>＋ 新建日期</button><button class=btn id=additem onclick=newItem style=display:none>＋ 添加行程</button></div><p id=place></p><div id=list></div><div id=empty class=empty>当前没有行程<br><button class=btn onclick=newItem>添加第一条行程</button></div><div class=summary>当天行程数：<b id=count>0</b>　预计耗时：<b id=hours>0h</b></div></main></div><dialog id=dlg><form onsubmit=saveItem(event)><h2 id=ft>添加行程</h2><input type=hidden id=eid><label>时间<input id=time type=time required></label><label>目的地<input id=dest required></label><label>游玩项目 / 必点菜<input id=act required></label><label>路线 / 交通<input id=route></label><label>耗时<input id=dur></label><label>备注<textarea id=notes></textarea></label><label>参考图片<input id=files type=file accept=image/* multiple></label><div id=preview class=pics></div><div class=foot><button type=button onclick=dlg.close()>取消</button><button class=btn>保存</button></div></form></dialog><div id=toast class=toast></div><script>let all=JSON.parse(localStorage.getItem('trip-plans-v4')||'null')||[],pi=0,di=0,imgs=[];const $=x=>document.getElementById(x);function save(){localStorage.setItem('trip-plans-v4',JSON.stringify(all))}function render(){plans.innerHTML=all.map((p,i)=>`<button class="plan ${i==pi?'on':''}" onclick="pi=${i};di=0;render()">● ${p.name}</button>`).join('');let p=all[pi];title.textContent=p?p.name:'还没有旅行计划';if(!p){dates.innerHTML='';day.textContent='先创建一个日期';place.textContent='';list.innerHTML='';empty.style.display='block';additem.style.display='none';return}dates.innerHTML=p.days.map((d,i)=>`<button class="date ${i==di?'on':''}" onclick="di=${i};render()">${d.date}<br><b>${d.name}</b></button>`).join('');let d=p.days[di];if(!d){day.textContent='先创建一个日期';empty.style.display='block';additem.style.display='none';return}day.textContent=d.name;place.textContent=d.place||'';additem.style.display='inline-block';let a=d.items||[];list.innerHTML=a.map(x=>`<div class=item><span>${x.time}</span><i class=dot></i><div><h4>${x.dest}</h4><div class=sub>${x.act} · ${x.route||'自行前往'} · ${x.dur||'未填写'}</div>${x.notes?`<div class=sub>${x.notes}</div>`:''}${x.imgs?.length?`<div class=pics>${x.imgs.map(s=>`<img src="${s}">`).join('')}</div>`:''}</div><button onclick="editItem(${x.id})">⋯</button></div>`).join('');empty.style.display=a.length?'none':'block';count.textContent=a.length;hours.textContent=(a.length*2.1).toFixed(1)+'h'}function newPlan(){let n=prompt('旅行计划名称，例如：青岛旅行计划');if(n){all.push({name:n,days:[]});pi=all.length-1;save();render()}}function newDay(){if(!all[pi])return newPlan();let date=prompt('日期，例如 2026-10-03');if(!date)return;let name=prompt('当天名称')||'我的行程',place=prompt('地点或区域')||'';all[pi].days.push({date,name,place,items:[]});di=all[pi].days.length-1;save();render()}function newItem(){if(!all[pi])return newPlan();if(!all[pi].days.length)return newDay();openItem()}function openItem(id){let d=all[pi].days[di],x=id&&d.items.find(i=>i.id==id);eid.value=id||'';ft.textContent=x?'编辑行程':'添加行程';imgs=x?.imgs?[...x.imgs]:[];time.value=x?.time||'';dest.value=x?.dest||'';act.value=x?.act||'';route.value=x?.route||'';dur.value=x?.dur||'';notes.value=x?.notes||'';preview.innerHTML=imgs.map(s=>`<img src="${s}">`).join('');dlg.showModal()}files.onchange=e=>[...e.target.files].forEach(f=>{let r=new FileReader;r.onload=()=>{imgs.push(r.result);preview.innerHTML=imgs.map(s=>`<img src="${s}">`).join('')};r.readAsDataURL(f)});function saveItem(e){e.preventDefault();let d=all[pi].days[di],id=+eid.value,x={id:id||Date.now(),time:time.value,dest:dest.value,act:act.value,route:route.value,dur:dur.value,notes:notes.value,imgs};d.items=id?d.items.map(i=>i.id==id?x:i):[...d.items,x];save();dlg.close();render()}function editItem(id){openItem(id)}render()</script></html>
