<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的旅行计划</title><style>body{font-family:system-ui;margin:0;background:#f7f5f0;color:#292a27}.app{max-width:760px;margin:auto;padding:0 16px 40px}.top{padding:20px 0;border-bottom:1px solid #ddd;font-size:20px;font-weight:bold}.hero{padding:30px 0}.hero h1{font-size:32px;margin:0 0 8px}.muted{color:#888}.dates{display:flex;gap:8px;overflow:auto;border-bottom:1px solid #ddd;padding-bottom:16px}.date{border:0;background:none;padding:12px;border-radius:8px;min-width:90px;text-align:left;color:#888}.date.active{background:#292a27;color:#fff}.date b,.date strong{display:block}.date strong{font-size:18px}.bar{display:flex;justify-content:space-between;align-items:end;padding:24px 0 15px}.add{background:#d96e4e;color:#fff;border:0;border-radius:7px;padding:11px;font-weight:bold}.item{display:grid;grid-template-columns:50px 12px 1fr 25px;gap:10px;border-top:1px solid #ddd;padding:18px 0}.point{width:10px;height:10px;border-radius:50%;background:#d96e4e}.item h3{margin:0 0 6px;font-size:15px}.sub,.note{margin:0;color:#888;font-size:12px;line-height:1.6}.note{color:#555}.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.thumbs img,.previews img{width:64px;height:64px;object-fit:cover;border-radius:6px}.empty{text-align:center;padding:50px;color:#888}.empty strong{display:block;color:#222;margin:8px}.summary{margin-top:20px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:15px}.stats{display:flex;justify-content:space-around;text-align:center}.stats b{display:block;font-size:22px}.stats span{font-size:11px;color:#888}dialog{border:0;border-radius:12px;width:min(500px,calc(100% - 25px));padding:20px}label{display:block;color:#888;font-size:12px;margin:11px 0}input,textarea{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1px solid #ddd;border-radius:6px;font:inherit}.upload{border:1px dashed #ccc;padding:10px}.foot{display:flex;justify-content:space-between;margin-top:18px}.foot button{padding:10px;border:0;border-radius:6px}.save{background:#d96e4e;color:#fff}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px;border-radius:6px}</style><body><div class="app"><div class="top">⌖ 我的旅行计划</div><div class="hero"><h1>我的旅行</h1><div class="muted">日期、地点、行程和图片全部由你创建</div></div><div id="dates" class="dates"></div><div class="bar"><h2 id="title">还没有创建日期</h2><div><button class="add" onclick="newDay()">＋ 新建日期</button><button class="add" id="add" onclick="openItem()" style="display:none">＋ 添加行程</button></div></div><div id="meta" class="muted"></div><div id="list"></div><div id="empty" class="empty">还没有行程<strong>先创建日期，再添加第一站</strong></div><div class="summary"><b>当天概览</b><div class="stats"><div><b id="count">0</b><span>行程</span></div><div><b id="hours">0h</b><span>预计耗时</span></div></div></div></div><dialog id="dlg"><form onsubmit="saveItem(event)"><h2 id="ftitle">添加行程</h2><input type="hidden" id="eid"><label>开始时间<input id="tm" type="time" required></label><label>目的地<input id="pl" required></label><label>游玩项目<input id="ac" required></label><label>路线 / 交通<input id="rt"></label><label>耗时<input id="du"></label><label>备注<textarea id="no"></textarea></label><label class="upload">参考图片（可多选）<input id="pics" type="file" accept="image/*" multiple>可上传拍照姿势、菜单、截图</label><div id="previews" class="previews"></div><div class="foot"><button type="button" onclick="dlg.close()">取消</button><button class="save">保存</button></div></form></dialog><div id="toast" class="toast"></div><script>let s=JSON.parse(localStorage.getItem('travel-planner-data')||'null')||{days:[],active:0},imgs=[];const $=x=>document.getElementById(x);function render(){dates.innerHTML=s.days.map((d,i)=>`<button class="date ${i==s.active?'active':''}" onclick="s.active=${i};render()"><b>${d.date}</b><strong>${d.name}</strong></button>`).join('');let d=s.days[s.active];if(!d){title.textContent='还没有创建日期';meta.textContent='先创建一个旅行日期';list.innerHTML='';empty.style.display='block';add.style.display='none';return}title.textContent=d.name;meta.textContent=d.place||'自定义地点';add.style.display='inline-block';let a=d.items||[];list.innerHTML=a.sort((x,y)=>x.time.localeCompare(y.time)).map(x=>`<div class="item"><span>${x.time}</span><i class="point"></i><div><h3>${x.place}</h3><p class="sub">${x.activity} · ${x.route||'自行前往'} · ${x.duration||'未填写'}</p>${x.notes?`<p class="note">${x.notes}</p>`:''}${x.images?.length?`<div class="thumbs">${x.images.map(i=>`<img src="${i}">`).join('')}</div>`:''}</div><button onclick="openItem(${x.id})">⋯</button></div>`).join('');empty.style.display=a.length?'none':'block';count.textContent=a.length;hours.textContent=a.length?(a.length*2.1).toFixed(1)+'h':'0h'}function newDay(){let date=prompt('请输入日期，例如 2026-10-03');if(!date)return;let name=prompt('请输入当天名称')||'我的行程',place=prompt('请输入地点或区域')||'';s.days.push({date,name,place,items:[]});s.active=s.days.length-1;localStorage.setItem('travel-planner-data',JSON.stringify(s));render()}function openItem(id){let d=s.days[s.active];if(!d)return newDay();let x=id&&d.items.find(i=>i.id==id);eid.value=id||'';ftitle.textContent=x?'编辑行程':'添加行程';imgs=x?.images?[...x.images]:[];tm.value=x?.time||'';pl.value=x?.place||'';ac.value=x?.activity||'';rt.value=x?.route||'';du.value=x?.duration||'';no.value=x?.notes||'';previews.innerHTML=imgs.map(i=>`<img src="${i}">`).join('');dlg.showModal()}pics.onchange=e=>[...e.target.files].forEach(f=>{let r=new FileReader;r.onload=()=>{imgs.push(r.result);previews.innerHTML=imgs.map(i=>`<img src="${i}">`).join('')};r.readAsDataURL(f)});function saveItem(e){e.preventDefault();let d=s.days[s.active],id=+eid.value,x={id:id||Date.now(),time:tm.value,place:pl.value,activity:ac.value,route:rt.value,duration:du.value,notes:no.value,images:imgs};d.items=id?d.items.map(i=>i.id==id?x:i):[...d.items,x];localStorage.setItem('travel-planner-data',JSON.stringify(s));dlg.close();render()}render()</script></body></html>
