<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行计划</title><style>body{margin:0;font:15px system-ui;background:#f6f4ef;color:#292a27}.layout{display:flex;min-height:100vh}.side{width:230px;background:#292a27;color:white;padding:22px 14px;box-sizing:border-box}.side h3{margin:0 8px 18px}.plan{display:block;width:100%;padding:11px 10px;border:0;background:none;color:#ccc;text-align:left;border-radius:6px}.plan.active{background:#4b4c47;color:#fff}.new{margin-top:12px;width:100%;padding:10px;border:1px dashed #777;background:none;color:white;border-radius:6px}.main{max-width:800px;flex:1;padding:30px}.dates{display:flex;gap:8px;overflow:auto;margin:20px 0;border-bottom:1px solid #ddd}.date{padding:12px;border:0;background:none;color:#888;min-width:90px}.date.active{background:#292a27;color:#fff;border-radius:7px}.bar{display:flex;justify-content:space-between;align-items:center}.btn{background:#d96e4e;color:#fff;border:0;border-radius:6px;padding:10px 13px;font-weight:700}.item{display:grid;grid-template-columns:55px 12px 1fr 25px;padding:17px 0;border-top:1px solid #ddd;gap:9px}.dot{width:10px;height:10px;background:#d96e4e;border-radius:50%;margin-top:4px}.item h4{margin:0 0 5px}.sub{font-size:12px;color:#888}.pics img{width:64px;height:64px;object-fit:cover;border-radius:5px;margin:5px 5px 0 0}.empty{text-align:center;color:#888;padding:45px}.summary{margin-top:25px;background:#fff;border:1px solid #ddd;padding:15px;border-radius:8px}dialog{border:0;border-radius:10px;padding:20px;width:min(480px,calc(100% - 30px))}label{display:block;color:#777;font-size:12px;margin:10px 0}input,textarea{width:100%;box-sizing:border-box;padding:9px;margin-top:5px;border:1px solid #ddd;border-radius:5px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{display:none;position:fixed;bottom:20px;left:50%;background:#222;color:#fff;padding:10px;border-radius:6px}@media(max-width:700px){.layout{display:block}.side{width:100%;padding:14px}.plan{display:none}.plan.active{display:block}.main{padding:20px 16px}}</style></head><body><div class="layout"><aside class="side"><h3>旅行计划</h3><div id="planList"></div><button id="newPlan" class="new">＋ 新建旅行计划</button></aside><main class="main"><h1 id="planTitle">还没有旅行计划</h1><p>每个计划独立保存，日期和行程全部由你创建</p><div id="dayList" class="dates"></div><div class="bar"><h2 id="dayTitle">先创建日期</h2><div><button id="newDay" class="btn">＋ 新建日期</button><button id="newItem" class="btn" hidden>＋ 添加行程</button></div></div><p id="dayPlace"></p><section id="items"></section><div id="empty" class="empty">当前没有行程</div><div class="summary">当天行程：<b id="total">0</b>　预计耗时：<b id="hours">0h</b></div></main></div><dialog id="itemDialog"><form id="itemForm"><h2 id="dialogTitle">添加行程</h2><input id="editId" type="hidden"><label>开始时间<input id="itemTime" type="time" required></label><label>目的地<input id="itemPlace" required></label><label>游玩项目 / 必点菜<input id="itemActivity" required></label><label>路线 / 交通<input id="itemRoute"></label><label>耗时<input id="itemDuration"></label><label>备注<textarea id="itemNotes"></textarea></label><label>参考图片<input id="itemFiles" type="file" accept="image/*" multiple></label><div id="imagePreview" class="pics"></div><div class="foot"><button type="button" id="cancelItem">取消</button><button class="btn" type="submit">保存</button></div></form></dialog><script>(function(){const $=id=>document.getElementById(id);const KEY='travel-planner-v5';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{plans:[],plan:0,day:0},pendingImages=[];function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function currentPlan(){return db.plans[db.plan]}function render(){const p=currentPlan();$('planList').innerHTML=db.plans.map((x,i)=>`<button class="plan ${i===db.plan?'active':''}" data-plan="${i}">● ${x.name}</button>`).join('');$('dayList').innerHTML=p?(p.days||[]).map((d,i)=>`<button class="date ${i===db.day?'active':''}" data-day="${i}">${d.date}<br><b>${d.name}</b></button>`).join(''):'';$('planTitle').textContent=p?p.name:'还没有旅行计划';const d=p?.days?.[db.day];$('dayTitle').textContent=d?d.name:'先创建日期';$('dayPlace').textContent=d?.place||'';$('newItem').hidden=!d;const arr=d?.items||[];$('items').innerHTML=arr.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(x=>`<div class="item"><span>${x.time}</span><i class="dot"></i><div><h4>${x.place}</h4><div class="sub">${x.activity} · ${x.route||'自行前往'} · ${x.duration||'未填写'}</div>${x.notes?`<div class="sub">${x.notes}</div>`:''}${x.images?.length?`<div class="pics">${x.images.map(s=>`<img src="${s}">`).join('')}</div>`:''}</div><button data-edit="${x.id}">⋯</button></div>`).join('');$('empty').style.display=arr.length?'none':'block';$('total').textContent=arr.length;$('hours').textContent=(arr.length*2.1).toFixed(1)+'h';document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{db.plan=+b.dataset.plan;db.day=0;persist();render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{db.day=+b.dataset.day;persist();render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openItem(+b.dataset.edit))}function ensurePlan(){if(!db.plans.length){db.plans.push({name:'我的旅行计划',days:[]});persist()}}$('newPlan').onclick=()=>{const n=prompt('旅行计划名称，例如：青岛旅行计划');if(n){db.plans.push({name:n,days:[]});db.plan=db.plans.length-1;db.day=0;persist();render()}};$('newDay').onclick=()=>{ensurePlan();const date=prompt('请输入日期，例如：2026-10-03');if(!date)return;const name=prompt('当天名称')||'我的行程';const place=prompt('地点或区域，可留空')||'';currentPlan().days.push({date,name,place,items:[]});db.day=currentPlan().days.length-1;persist();render()};$('newItem').onclick=()=>openItem();$('cancelItem').onclick=()=>$('itemDialog').close();$('itemFiles').onchange=e=>{[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{pendingImages.push(r.result);$('imagePreview').innerHTML=pendingImages.map(s=>`<img src="${s}">`).join('')};r.readAsDataURL(f)});e.target.value=''};function openItem(id){const d=currentPlan().days[db.day],x=id?d.items.find(i=>i.id===id):null;$('editId').value=id||'';$('dialogTitle').textContent=x?'编辑行程':'添加行程';pendingImages=x?.images?[...x.images]:[];$('itemTime').value=x?.time||'';$('itemPlace').value=x?.place||'';$('itemActivity').value=x?.activity||'';$('itemRoute').value=x?.route||'';$('itemDuration').value=x?.duration||'';$('itemNotes').value=x?.notes||'';$('imagePreview').innerHTML=pendingImages.map(s=>`<img src="${s}">`).join('');$('itemDialog').showModal()}$('itemForm').onsubmit=e=>{e.preventDefault();const d=currentPlan().days[db.day],id=+$('editId').value,x={id:id||Date.now(),time:$('itemTime').value,place:$('itemPlace').value,activity:$('itemActivity').value,route:$('itemRoute').value,duration:$('itemDuration').value,notes:$('itemNotes').value,images:pendingImages};d.items=id?d.items.map(i=>i.id===id?x:i):[...(d.items||[]),x];persist();$('itemDialog').close();render()};ensurePlan();render()})();</script></body></html>
